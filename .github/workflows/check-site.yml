name: Check website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Check generated HTML, sitemap and assets
        run: uv run --no-project --python 3.12 python scripts/check_release.py
      - name: Check delayed and offline published content
        run: node scripts/check-site-data.mjs
