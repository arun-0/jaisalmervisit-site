<head>

<style>
/* Layout: sandstone sidebar of datasets on the left, a working table in the middle, an edit drawer sliding in from the right.
   Colours and type follow the Jaisalmer Visit site (desert charcoal, ivory, sandstone copper, muted gold). */
:root{
  --bg:#F5EBD7; --panel:#FBF6EC; --sunk:#EDE0C8; --ink:#1E2523; --ink-2:#5E5A51; --line:rgba(23,43,42,.14); --line-2:rgba(23,43,42,.26);
  --charcoal:#172B2A; --on-charcoal:#F7F1E5; --copper:#A86330; --copper-ink:#8F512A; --gold:#C9A45C;
  --ok:#2F6B4F; --ok-bg:rgba(47,107,79,.12); --warn:#8A5D14; --warn-bg:rgba(201,150,60,.18); --err:#A8443F; --err-bg:rgba(168,68,63,.12);
  --info:#3F6F7A; --info-bg:rgba(63,111,122,.12); --scrim:rgba(12,24,23,.5);
  --f-display:'Playfair Display',Georgia,serif; --f-body:'Inter',-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111D1C; --panel:#172726; --sunk:#0D1716; --ink:#EDE6D8; --ink-2:#A9A293; --line:rgba(237,230,216,.12); --line-2:rgba(237,230,216,.24);
  --charcoal:#0A1413; --on-charcoal:#F7F1E5; --copper:#C98A55; --copper-ink:#E0A574; --gold:#D8B672;
  --ok:#8FC7A8; --ok-bg:rgba(143,199,168,.14); --warn:#EDCB8A; --warn-bg:rgba(237,203,138,.14); --err:#F0A99F; --err-bg:rgba(240,169,159,.14);
  --info:#9CC9D3; --info-bg:rgba(156,201,211,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111D1C; --panel:#172726; --sunk:#0D1716; --ink:#EDE6D8; --ink-2:#A9A293; --line:rgba(237,230,216,.12); --line-2:rgba(237,230,216,.24);
  --charcoal:#0A1413; --on-charcoal:#F7F1E5; --copper:#C98A55; --copper-ink:#E0A574; --gold:#D8B672;
  --ok:#8FC7A8; --ok-bg:rgba(143,199,168,.14); --warn:#EDCB8A; --warn-bg:rgba(237,203,138,.14); --err:#F0A99F; --err-bg:rgba(240,169,159,.14);
  --info:#9CC9D3; --info-bg:rgba(156,201,211,.14); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--charcoal);color:var(--on-charcoal);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;line-height:1;padding:0 8px}
.brand small{font-family:var(--f-display);font-size:.8rem;letter-spacing:.06em;opacity:.7}
.brand b{font-family:var(--f-display);font-size:1.45rem;color:var(--gold)}
.brand span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:0 10px 4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:inherit;font-size:.9rem;font-weight:500}
.nav button:hover{background:rgba(247,241,229,.07)}
.nav button[aria-current="page"]{background:rgba(201,164,92,.16);color:#F7D77A}
.nav .cnt{font:500 .72rem var(--f-mono);opacity:.7;font-variant-numeric:tabular-nums}
.nav .dot{width:7px;height:7px;border-radius:50%;background:#F0A99F;flex:none}
.side-foot{margin-top:auto;font-size:.75rem;opacity:.65;padding:0 10px;line-height:1.45}
/* main */
.main{min-width:0;padding-inline:clamp(16px,3vw,36px);padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:700}
.top .sub{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.top-end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok);background:var(--ok-bg)} .sync.warn{color:var(--warn);background:var(--warn-bg)} .sync.err{color:var(--err);background:var(--err-bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--copper)}
.btn.primary{background:var(--charcoal);border-color:var(--charcoal);color:var(--on-charcoal)}
:root[data-theme="dark"] .btn.primary{background:var(--copper);border-color:var(--copper);color:#1A120B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--copper);border-color:var(--copper);color:#1A120B}}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{background:none;border-color:transparent;color:var(--copper-ink)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.f input[readonly],.f select:disabled{opacity:.65;cursor:not-allowed}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);font-size:.86rem;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.banner.info{background:var(--info-bg);border-color:transparent}
.banner b{display:block}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
button.tile:hover{border-color:var(--copper)}
.tile .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.tile .v{font:600 1.7rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tile .s{font-size:.78rem;color:var(--ink-2)}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:1.15rem}
.sec-h p{margin:0;color:var(--ink-2);font-size:.85rem}
.issues{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.issues li+li{border-top:1px solid var(--line)}
.issues button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px}
.issues button:hover{background:var(--sunk)}
.issues .ds{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.issues .t{min-width:0}.issues .t b{font-weight:600}.issues .t span{color:var(--ink-2)}
.empty-note{padding:16px;color:var(--ink-2);font-size:.88rem}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--info-bg);color:var(--info)}
/* list */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:0 10px;min-height:38px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:0 12px;min-height:36px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--charcoal);color:var(--on-charcoal)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td.name b{font-weight:600;display:block}
td.name span{color:var(--ink-2);font-size:.8rem}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
td .pills{display:flex;gap:4px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-size:.78rem}
.ds-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:.8rem}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dr-head h2{font-family:var(--f-display);font-size:1.25rem}
.dr-head p{margin:2px 0 0;color:var(--ink-2);font-size:.82rem}
.dr-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);font-size:1.2rem;line-height:1;flex:none}
.dr-body{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.dr-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.dr-foot .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;font-size:.85rem;color:var(--err);font-weight:600}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
legend{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--copper-ink);margin-bottom:10px;padding:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:.8rem;font-weight:600}
.f .hint{font-size:.74rem;color:var(--ink-2)}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
.f textarea{resize:vertical;min-height:76px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--copper);outline-offset:0;border-color:var(--copper)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err)}
.f .msg{font-size:.74rem;font-weight:600}
.f .msg.err{color:var(--err)} .f .msg.warn{color:var(--warn)} .f .msg.info{color:var(--info)}
.chk{display:flex;align-items:center;gap:8px;min-height:38px;font-size:.86rem;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--copper)}
.multi{display:flex;flex-wrap:wrap;gap:6px 14px}
.multi .chk{min-height:30px}
.rec-issues{display:flex;flex-direction:column;gap:6px}
.rec-issues div{font-size:.82rem;padding:7px 10px;border-radius:8px}
.rec-issues .err{background:var(--err-bg);color:var(--err)} .rec-issues .warn{background:var(--warn-bg);color:var(--warn)} .rec-issues .info{background:var(--info-bg);color:var(--info)}
/* export */
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.out{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.out-h{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.out-h h3{font-size:1rem;font-weight:700}
.out-h p{margin:0;color:var(--ink-2);font-size:.82rem}
.out-h code{font-family:var(--f-mono);font-size:.76rem;background:var(--sunk);padding:1px 5px;border-radius:4px}
.out pre{margin:0;max-height:200px;overflow:auto;background:var(--sunk);padding:12px 16px;font:400 .74rem/1.5 var(--f-mono);white-space:pre;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.out-f{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap}
.out-f .meta{margin-left:auto;font-size:.75rem;color:var(--ink-2);font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--charcoal);color:var(--on-charcoal);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.86rem;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;gap:14px;overflow:visible}
  .brand span,.side-foot,.nav-label{display:none}
  .brand b{font-size:1.1rem}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none;min-width:0}
  .nav-group{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px;font-size:.84rem}
  .nav .cnt{display:none}
  fieldset{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
/* sign-in */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.login-card .brand{background:var(--charcoal);color:var(--on-charcoal);padding:22px 24px}
.login-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px}
.login-body h1{font-family:var(--f-display);font-size:1.35rem}
.login-body p{margin:0;color:var(--ink-2);font-size:.88rem}
.login-body .btn{min-height:44px}
.side-foot .who{display:block;font-weight:600;word-break:break-all;margin-bottom:4px}
.side-foot button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-size:inherit}
/* upload next to a URL field */
.up-row{display:flex;gap:6px;min-width:0}
.geo-btns{display:flex;flex-wrap:wrap;gap:8px}
.geo-pick{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:16px}
.geo-pick-card{background:var(--panel);border-radius:var(--r);width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.geo-pick-head{display:flex;flex-direction:column;gap:2px;padding:12px 16px}
.geo-pick-head .hint{font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.geo-pick-map{height:min(60vh,480px);min-height:260px}
.geo-pick-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.up-row input{flex:1;min-width:0}
.up-row .btn{min-height:38px;flex:none}
.ann-prev{display:flex;flex-direction:column;gap:6px}
.ann-prev iframe{border:1px solid var(--line);border-radius:8px;height:46px;max-width:100%;background:#F5EBD7}
.ann-prev-wide{overflow:hidden;height:30px;border-radius:8px}
.ann-prev-wide iframe{transform:scale(.43);transform-origin:0 0;height:70px;max-width:none}
.pub-list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pub-list li{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px}
.pub-list li+li{border-top:1px solid var(--line)}
.pub-list .t{flex:1;min-width:180px}.pub-list .t b{display:block;font-weight:600}.pub-list .t span{color:var(--ink-2);font-size:.82rem}
.rv-stars{color:#B7791F;letter-spacing:1px}
</style>
</head>

trance","Fine wall paintings in parts of the interior"],"tips":"Look closely at the two halves of the facade to spot the asymmetry — it's easy to miss at a glance.","nearby":["Patwon Ki Haveli","Salim Singh Ki Haveli"],"bestTime":"Morning, paired with Patwon and Salim Singh havelis.","location":"Old city, near Patwon Ki Haveli","distance":"~10 minute walk from Jaisalmer Fort","address":"","timing":"","ticketText":"","ticketUrl":"","lat":26.9142,"lng":70.9127,"mapCategory":"attractions","mapSub":"Fort & Havelis","phone":"","whatsapp":"","website":"","email":"","youtubeUrl":"","services":[]},{"_uid":"r5d","id":"gadisar","name":"Gadisar Lake","tag":"Nature · Lake","visible":true,"short":"A man-made lake that was once the city's main water source, ringed with small shrines.","why":"Built to store water for a desert city, the lake is now Jaisalmer's most relaxed public space — ghats, temples, and migratory birds in winter.","see":["The carved entrance gateway, Tilon Ki Pol","Small temples and chhatris along the banks","Migratory birds in the cooler months"],"tips":"Boat rides are available on the lake; agree the price and duration before boarding.","nearby":["Jaisalmer Fort","Gandhi Chowk market"],"bestTime":"Sunset, for boating and the golden light on the water.","location":"Southeast edge of the old city","distance":"~15 minute walk from Jaisalmer Fort","address":"","timing":"","ticketText":"","ticketUrl":"","lat":26.908,"lng":70.9219,"mapCategory":"attractions","mapSub":"Lakes","phone":"","whatsapp":"","website":"","email":"","youtubeUrl":"","services":[]},{"_uid":"r6d","id":"sulidungri","name":"Suli Dungar Viewpoint","tag":"Nature · Sunset Viewpoint","visible":true,"short":"A small hilltop lookout on the west side of town, with a sweeping view of the fort and the Golden City.","why":"Often simply called \"Sunset Point\" by locals, this quiet platform above the city gives one of the best panoramas of Jaisalmer Fort — especially as the sandstone glows at sunset and the const GUIDE_SLOTS=[['intro','Welcome — first visit'],['home','Home page (top)'],['explore','Explore Jaisalmer section'],['plan','Plan a trip section'],['things-to-do','Things to do section'],['transport','Getting around section'],['map','Smart Tourist Map'],['tourist-mode','Tourist Mode'],['place','Every place — unless it has its own clip'],['go-explore','Guide Me → Explore Places'],['go-desert','Guide Me → Desert Experience'],['go-transport','Guide Me → Find Transport'],['go-map','Guide Me → Use Tourist Map'],['go-history','Guide Me → Listen to History'],['go-expert','Guide Me → Find Local Expert'],['go-plan','Guide Me → Plan My Trip'],['help','Help']];
const guidePlaces=()=>(state.data.places||[]).filter(p=>/^[a-z0-9][a-z0-9-]{0,52}$/.test(p.id||''));
function guideSlot(id){const g=GUIDE_SLOTS.find(x=>x[0]===id);if(g)return g[1];const p=/^place-/.test(id||'')&&guidePlaces().find(p=>'place-'+p.id===id);return p?'Place — '+(p.name||p.id):'';}
const guideSlotOpts=()=>GUIDE_SLOTS.map(g=>opt(g[0],g[1])).concat(guidePlaces().map(p=>opt('place-'+p.id,'Place — '+(p.name||p.id))));
// page / section / triggerType are labels the site barely uses; they follow the chosen spot instead of being typed.
function guideFill(r){const d=(DEFAULTS.guidance||[]).find(x=>x.id===r.id),pl=/^place-/.test(r.id);
  if(d||pl){r.page=pl?'place':d.page;r.section=pl?'place':d.section;r.triggerType=pl?'place-open':d.triggerType;}
  if(blank(r.title))r.title=pl?(guideSlot(r.id).replace(/^Place — /,'')):(d&&d.title)||guideSlot(r.id);}
/* Landmark Map category, with Parking / ATM / Toilet as their own choices (client, 29 Oct 2026). Each one is stored as the
   category + sub-category pair the map already uses: transport/Parking (blue P, a place's Parking button), essential/ATM, essential/Toilet, essential/Petrol Pump (Petrol Pump added 2 Nov 2026; the map's Essentials filter and
   Tourist Mode's "Petrol" look for it there). */
const LM_SHORTCUTS=[['transport','Parking'],['essential','ATM'],['essential','Toilet'],['essential','Petrol Pump']];
const LM_CAT_OPTS=MAP_CATS.map(c=>opt(c)).concat(LM_SHORTCUTS.map(([c,s])=>opt(c+'/'+s,s)));
const DAY_NS=[1,2,3,4,5];
const dayFilled=d=>!!(d&&typeof d==='object'&&[d.morning,d.afternoon,d.evening].some(v=>String(v||'').trim()));
const ANN_THEMES=[opt('','Desert sky (standard)'),opt('lightblue','Light blue'),opt('gold','Gold'),opt('green','Green'),opt('orange','Orange'),opt('purple','Purple'),opt('dark','Dark')];

/* Copy the built-in defaults into the database, published (they are already on the site). */
async function materialize(k){

  const cur=clone(DEFAULTS[k]),uids=cur.map(r=>r._uid);

  await persist(k,{publish:ok.map(r=>r._uid),removes:p.gone});

      onData(k,rows,at){
        if(rows){state.data[k]=rows;state.source[k]='db';state.saved[k]=at;}
        else{state.data[k]=clone(DEFAULTS[k]);state.source[k]='default';state.saved[k]=null;}
        state.mode='synced';refresh();
      },
      onLive(k,items){if(!ORDER.includes(k))return;state.live[k]=items?new Map(items.map(r=>[r._uid,r])):null;refresh();},
      onError(e){state.mode='error';renderTop();if(e&&e.code==='permission-denied')toast('This account can’t read the admin data.');}
    });
    const inboxErr=()=>{state.mode='error';renderTop();};
    const u1=B.watchInbox('serviceSubmissions',rows=>{state.subs=rows;refresh();},inboxErr);
    const u2=B.watchInbox('newsletter',rows=>{state.news=rows;refresh();},inboxErr);
    const u3=B.watchInbox('reviews',rows=>{state.reviews=rows;refresh();},inboxErr,2000);
    const u0=unwatch;unwatch=()=>{u0();u1();u2();u3();};
    renderLogin();render();
  });
}

/* ================= map provider check (Settings) =================
   Asks the chosen tile / routing provider for one tile and one short route from this page (same domain as the
   website), so a missing key or an unregistered domain shows up here — not as "401 Error" tiles for visitors. */
function tileProbeUrl(r){
  const z=13,n=1<<z,lat=26.9124*Math.PI/180,x=Math.floor((70.9127+180)/360*n),y=Math.floor((1-Math.log(Math.tan(lat)+1/Math.cos(lat))/Math.PI)/2*n);
  if(r.tiles==='stadia')return 'https://tiles.stadiamaps.com/tiles/alidade_smooth/'+z+'/'+x+'/'+y+'.png'+(r.stadiaKey?'?api_key='+encodeURIComponent(r.stadiaKey):'');
  if(r.tiles==='maptiler')return r.maptilerKey?'https://api.maptiler.com/maps/streets-v2/256/'+z+'/'+x+'/'+y+'.png?key='+encodeURIComponent(r.maptilerKey):null;
  if(r.tiles==='mapbox')return r.mapboxToken?'https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/512/'+(z-1)+'/'+(x>>1)+'/'+(y>>1)+'?access_token='+encodeURIComponent(r.mapboxToken):null;
  return null;
}
function routeProbe(r){
  if(r.routing==='stadia')return {url:'https://api.stadiamaps.com/route/v1'+(r.stadiaKey?'?api_key='+encodeURIComponent(r.stadiaKey):''),
    init:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({locations:[{lat:26.9124,lon:70.9127},{lat:26.9126,lon:70.9150}],costing:'auto'})}};
  if(r.routing==='mapbox'&&r.mapboxToken)return {url:'https://api.mapbox.com/directions/v5/mapbox/driving/70.9127,26.9124;70.9150,26.9126?overview=false&access_token='+encodeURIComponent(r.mapboxToken),init:{}};
  return null;
}
async function probeMap(r){
  const out=[];
  const one=async(label,url,init)=>{
    if(!url)return;
    try{const res=await fetch(url,Object.assign({credentials:'omit',referrerPolicy:'strict-origin-when-cross-origin'},init||{}));
      if(res.status===401||res.status===403)out.push(['err',label+' refused this site (HTTP '+res.status+'). '+(/Stadia/.test(label)?'Add '+location.hostname+' in the Stadia dashboard (your property → Authentication), or paste a Stadia API key.':'Check the key, and that it allows '+location.hostname+'.')]);
      else if(!res.ok)out.push(['warn',label+' answered HTTP '+res.status+'.']);
      else out.push(['ok',label+' work for '+location.hostname+'.']);
    }catch(e){out.push(['warn',label+' couldn’t be reached from here (offline or blocked).']);}
  };
  await one({stadia:'Stadia map tiles',maptiler:'MapTiler tiles',mapbox:'Mapbox tiles'}[r.tiles],tileProbeUrl(r));
  const rp=routeProbe(r);if(rp)await one({stadia:'Stadia directions',mapbox:'Mapbox directions'}[r.routing],rp.url,rp.init);
  return out;
}
let mapCheckSeq=0,mapCheckCache=null;   // the admin re-renders on every live update: re-ask the provider at most once a minute
async function mapCheck(r){
  const box=document.getElementById('mapCheck');if(!box)return;
  if(!tileProbeUrl(r)&&!routeProbe(r)){box.hidden=true;return;}
  const key=[r.tiles,r.routing,r.stadiaKey,r.maptilerKey,r.mapboxToken].join('|'),fresh=mapCheckCache&&mapCheckCache.key===key&&Date.now()-mapCheckCache.at<60000;
  const seq=++mapCheckSeq;box.hidden=false;
  if(!fresh){box.className='banner info';box.innerHTML='<div><b>Checking the map provider…</b></div>';}
  const res=fresh?mapCheckCache.res:await probeMap(r);if(seq!==mapCheckSeq||!box.isConnected)return;
  mapCheckCache={key,res,at:fresh?mapCheckCache.at:Date.now()};
  const bad=res.some(x=>x[0]==='err'),warn=res.some(x=>x[0]==='warn');
  box.className='banner '+(bad||warn?'warn':'info');
  box.innerHTML='<div><b>'+(bad?'The map provider rejects this site':warn?'Map provider check':'Map provider works')+'</b>'+res.map(x=>esc(x[1])).join(' ')+(bad?' Until it’s fixed, visitors see OpenStreetMap tiles instead.':'')+'</div>';
}

  if(t.id==='dlAll'){const b={exportedAt:new Date().toISOString(),datasets:{}};ORDER.forEach(k=>b.datasets[k]=clone(state.data[k]));download('visit-jaisalmer-backup-'+b.exportedAt.slice(0,10)+'.json',JSON.stringify(b,null,2));}
});

/* Place photos come straight from phones (often 3–8 MB): scale to at most 1600 px wide as JPEG before uploading.
   Small files, SVG/GIF, or a browser that can't decode the image are uploaded unchanged. */
async function shrinkPhoto(file){
  const MAX=1600;
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name))return file;
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,MAX/bmp.width),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
    if(k===1&&file.size<600*1024&&/jpe?g|webp/i.test(file.type)){bmp.close&&bmp.close();return file;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close&&bmp.close();
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    if(!blob)return file;
    return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
  }catch(err){console.warn('Photo resize skipped',err);return file;}
}
/* What went wrong with an upload, in words an editor can act on (Firebase's code at the end for support). */
function uploadErrorText(err){
  const code=(err&&err.code)||'',sr=String((err&&err.customData&&err.customData.serverResponse)||'');
  const tail=code?' ('+code+')':'';
  if(code==='storage/unauthorized')return 'Upload refused by Firebase Storage — this account isn’t allowed to upload. Nothing was saved; tell your developer'+tail+'.';
  if(code==='storage/quota-exceeded'||/billing|402/i.test(sr))return 'Upload refused: Firebase Storage needs the project’s billing (Blaze plan) to be active. Nothing was saved'+tail+'.';
  if(code==='storage/retry-limit-exceeded'||code==='storage/canceled')return 'Upload didn’t finish (slow or lost connection). Please try again'+tail+'.';
  if(code&&/^storage\//.test(code))return 'Upload failed — nothing was saved. Please try again, or send this to your developer'+tail+'.';
  return (err&&err.message)||'Upload failed — nothing was saved.';
}
/* Length of a chosen audio file in whole seconds (read locally, before upload), or null. */
function audioLength(file){
  return new Promise(res=>{
    try{const a=new Audio(),u=URL.createObjectURL(file);let fin=false;const done=v=>{if(fin)return;fin=true;URL.revokeObjectURL(u);res(v);};
      a.preload='metadata';a.onloadedmetadata=()=>done(isFinite(a.duration)&&a.duration>0?Math.round(a.duration):null);a.onerror=()=>done(null);a.src=u;
      setTimeout(()=>done(null),8000);
    }catch(e){res(null);}
  });
}
